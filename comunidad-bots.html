      .carousel-dot {

        height: 7px;
      }

        width: 22px;
      }
    }
  </style>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => {
        if (el.isIntersecting) {
          el.target.classList.add('visible');
          observer.unobserve(el.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));

    document.querySelectorAll('img[data-placeholder]').forEach((img) => {
      const showPlaceholder = () => {
        if (img.classList.contains('is-missing')) return;
        img.classList.add('is-missing');
        const placeholder = document.createElement('div');
        placeholder.className = 'image-placeholder';
        placeholder.textContent = `Añade ${img.dataset.placeholder}`;
        img.insertAdjacentElement('afterend', placeholder);
      };
      img.addEventListener('error', showPlaceholder, { once: true });
      if (img.complete && img.naturalWidth === 0) showPlaceholder();
    });

    document.querySelectorAll('[data-carousel]').forEach((carousel) => {
      const track = carousel.querySelector('.carousel-track');
      const dotsContainer = carousel.querySelector('[data-dots]');
      const progressBar = carousel.querySelector('[data-progress]');
      const prevBtn = carousel.querySelector('[data-prev]');
      const nextBtn = carousel.querySelector('[data-next]');
      const slides = Array.from(track.querySelectorAll('.carousel-slide'));
      const autoplay = carousel.dataset.autoplay !== 'false';
      const total = slides.length;
      let current = 0;
      let autoPlayTimer = null;

      function getVisibleSlides() {
        if (window.innerWidth <= 520) return 1;
        if (window.innerWidth <= 860) return 2;
        return Math.min(3, total);
      }

      function getMaxIndex() {
        return Math.max(0, total - getVisibleSlides());
      }

      function buildDots() {
        dotsContainer.innerHTML = '';
        for (let i = 0; i <= getMaxIndex(); i++) {
          const dot = document.createElement('button');
          dot.className = 'carousel-dot' + (i === current ? ' active' : '');
          dot.addEventListener('click', () => goTo(i));
          dotsContainer.appendChild(dot);
        }
      }

      function updateCarousel() {
        const slideWidth = slides[0].offsetWidth;
        current = Math.min(current, getMaxIndex());
        track.style.transform = `translateX(-${current * slideWidth}px)`;

        dotsContainer.querySelectorAll('.carousel-dot').forEach((dot, index) => {
          dot.classList.toggle('active', index === current);
        });

        progressBar.style.width = ((current + 1) / (getMaxIndex() + 1) * 100) + '%';
      }

      function goTo(index) {
        const maxIndex = getMaxIndex();
        if (index > maxIndex) current = 0;
        else if (index < 0) current = maxIndex;
        else current = index;
        updateCarousel();
        resetAutoPlay();
      }

      function next() { goTo(current + 1); }
      function prev() { goTo(current - 1); }

      function startAutoPlay() {
        if (!autoplay) return;
        autoPlayTimer = setInterval(next, 2800);
      }

      function resetAutoPlay() {
        clearInterval(autoPlayTimer);
        startAutoPlay();
      }

      prevBtn.addEventListener('click', prev);
      nextBtn.addEventListener('click', next);
      carousel.addEventListener('mouseenter', () => clearInterval(autoPlayTimer));
      carousel.addEventListener('mouseleave', startAutoPlay);
      window.addEventListener('resize', () => {
        buildDots();
        updateCarousel();
      });

      buildDots();
      updateCarousel();
      startAutoPlay();
    });
  </script>
</body>

</html>
