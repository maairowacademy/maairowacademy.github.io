    main,

    .showcase,
    .showcase-inner,

    }

    a {

    .carousel-track {

      justify-content: center;

      overflow: hidden;

    .carousel-controls {

      align-items: center;

    .carousel-btn {

    .carousel-dots {

    .carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 255, 255, .18);

    .carousel-dot.active {

    .carousel-progress {

      background: rgba(255, 255, 255, .08);

    .carousel-progress-bar {

      }

      }

      .carousel-btn {
        width: 38px;
        height: 38px;
      }
    }
  </style>

  <script>

    document.querySelectorAll('[data-carousel]').forEach((carousel) => {

      const track =
        carousel.querySelector('.carousel-track');

      const dotsContainer =
        carousel.querySelector('[data-dots]');

      const progressBar =
        carousel.querySelector('[data-progress]');

      const prevBtn =
        carousel.querySelector('[data-prev]');

      const nextBtn =
        carousel.querySelector('[data-next]');

      const slides =
        Array.from(
          track.querySelectorAll('.carousel-slide')
        );

      const autoplay =
        carousel.dataset.autoplay !== 'false';

      const total = slides.length;

      let current = 0;
      let autoPlayTimer = null;

      function getVisibleSlides() {

        if (window.innerWidth <= 520) return 1;

        if (window.innerWidth <= 860) return 2;

        return Math.min(3, total);
      }

      function getMaxIndex() {

        return Math.max(
          0,
          total - getVisibleSlides()
        );
      }

      function buildDots() {

        dotsContainer.innerHTML = '';

        for (let i = 0; i <= getMaxIndex(); i++) {

          const dot =
            document.createElement('button');

          dot.className =
            'carousel-dot' +
            (i === current ? ' active' : '');

          dot.addEventListener(
            'click',
            () => goTo(i)
          );

          dotsContainer.appendChild(dot);
        }
      }

      function updateCarousel() {

        const slideWidth =
          slides[0].getBoundingClientRect().width;

        current =
          Math.min(current, getMaxIndex());

        const translate =
          current * slideWidth;

        track.style.transform =
          `translate3d(-${translate}px,0,0)`;

        dotsContainer
          .querySelectorAll('.carousel-dot')
          .forEach((dot, index) => {

            dot.classList.toggle(
              'active',
              index === current
            );
          });

        progressBar.style.width =
          (
            ((current + 1) /
              (getMaxIndex() + 1)) * 100
          ) + '%';
      }

      function goTo(index) {

        const maxIndex = getMaxIndex();

        if (index > maxIndex) {
          current = 0;
        }

        else if (index < 0) {
          current = maxIndex;
        }

        else {
          current = index;
        }

        updateCarousel();
        resetAutoPlay();
      }

      function next() {
        goTo(current + 1);
      }

      function prev() {
        goTo(current - 1);
      }

      function startAutoPlay() {

        if (!autoplay) return;

        autoPlayTimer =
          setInterval(next, 3000);
      }

      function resetAutoPlay() {

        clearInterval(autoPlayTimer);

        startAutoPlay();
      }

      prevBtn?.addEventListener('click', prev);
      nextBtn?.addEventListener('click', next);

      let resizeTimeout;

      window.addEventListener('resize', () => {

        clearTimeout(resizeTimeout);

        resizeTimeout = setTimeout(() => {

          buildDots();
          updateCarousel();

        }, 80);
      });

      buildDots();
      updateCarousel();
      startAutoPlay();

    });

  </script>
